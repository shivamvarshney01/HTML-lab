<!doctype html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>CSS Grid Layout</title><style>body{font-family:Arial;padding:20px}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:12px}.cell{background:#dceaf7;padding:28px;text-align:center;border-radius:8px}.header{grid-column:1/-1;background:#285b8f;color:white}</style></head><body><h1>CSS Grid</h1><div class="grid"><div class="cell header">Page Header</div><div class="cell">Sidebar</div><div class="cell">Main Content</div><div class="cell">Extra Content</div><div class="cell">Footer</div></div></body></html>
