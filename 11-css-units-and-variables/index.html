<!doctype html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>CSS Units and Variables</title><style>:root{--primary:#285b8f;--space:1rem}body{font-family:Arial;margin:2rem;color:#263238}.panel{background:#eaf2fa;border-left:5px solid var(--primary);padding:var(--space);width:min(80%,32rem)}h1{color:var(--primary);font-size:2rem}.small{font-size:0.9em}.wide{width:70vw;background:#dce8f4;padding:1vh}</style></head><body><h1>CSS Units and Variables</h1><div class="panel"><p>Spacing uses rem, heading size uses rem, and the content width uses percent.</p><p class="small">This text uses em units.</p></div><p class="wide">This block uses viewport units (vw and vh).</p></body></html>
