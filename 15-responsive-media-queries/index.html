<!doctype html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Responsive Media Queries</title><style>body{font-family:Arial;margin:0;padding:24px;background:#eef2f7}.layout{display:flex;gap:16px}.box{flex:1;background:white;padding:24px;border-radius:10px}@media(max-width:600px){body{padding:12px}.layout{flex-direction:column}.box{background:#e0efff}h1{font-size:1.5rem}}</style></head><body><h1>Responsive Webpage</h1><p>Resize the browser window. On screens 600px wide or smaller, the layout changes to one column.</p><main class="layout"><section class="box"><h2>Desktop</h2><p>Content is displayed in columns on wider screens.</p></section><section class="box"><h2>Mobile</h2><p>Content stacks vertically on smaller screens.</p></section></main><footer><p>Shivam | BCS2025453</p></footer></body></html>
