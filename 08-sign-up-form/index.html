<!doctype html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Sign Up Form</title><style>body{font-family:Arial;max-width:440px;margin:30px auto;padding:16px}label{display:block;margin:12px 0 4px}input,select,button{box-sizing:border-box;width:100%;padding:10px;margin-top:4px}</style></head><body><h1>Create an Account</h1><form id="signup"><label for="name">Full Name</label><input id="name" name="name" required><label for="email">Email</label><input id="email" name="email" type="email" required><label for="password">Password</label><input id="password" name="password" type="password" minlength="6" required><label for="course">Course</label><select id="course" name="course"><option>B.Tech CSE</option><option>BCA</option><option>BBA</option></select><button type="submit">Sign Up</button></form><p id="message" aria-live="polite"></p><script>document.getElementById("signup").addEventListener("submit",e=>{e.preventDefault();document.getElementById("message").textContent="Form submitted successfully (demo)."});</script></body></html>
